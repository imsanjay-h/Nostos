name: Sync Nostos collections

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *' # About every six hours; GitHub may delay scheduled jobs.

permissions:
  contents: write

concurrency:
  group: nostos-collection-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Nostos
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Sync public platform collections
        env:
          LETTERBOXD_USERNAME: ${{ vars.LETTERBOXD_USERNAME }}
          ANILIST_USERNAME: ${{ vars.ANILIST_USERNAME }}
          GOODREADS_USER_ID: 204602920
        run: python scripts/sync_collections.py
      - name: Commit collection updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/films.json data/anime.json data/books.json
          if git diff --cached --quiet; then
           echo "No collection changes to commit."
          else
            git commit -m "chore: sync Nostos collections"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
